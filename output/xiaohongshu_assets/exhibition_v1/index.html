</style></head><body><div id="app"></div><script>

const slides={
'cover-a':`<main class="slide cover-a"><img src="cover-bg.png"><div class="cover-copy"><span class="pill">海外展会｜线索跟进</span><h1>带回<span class="big num">300</span>条线索<br>30天后只剩<br>一张Excel</h1><p>问题可能不在展会质量<br>而在展会之后，没有人持续经营</p></div><div class="brand">黔海 QIANHAI</div><div class="cover-note">外贸人最容易忽略的展后动作 →</div></main>`,
'cover-b':`<main class="slide cover-b"><div class="top"><span class="eyebrow" style="color:#8ec0ff">真实产品界面拆解</span><h1>300条展会线索<br><span class="red">怎么变成下一步行动？</span></h1><p class="subtitle" style="color:#cbd6e6">从名片堆和Excel，到可跟进的客户队列</p></div><div class="brand">黔海 QIANHAI</div><div class="compare"><div class="box"><b style="font-size:32px">展会回来后</b><div class="cards">${'<i class="cardmini"></i>'.repeat(12)}</div><div class="excel">${'<i></i>'.repeat(7)}</div></div><div class="arrow">→</div><div class="box"><img class="uiimg" src="${base}03_customer_workbench_tasks.png"></div></div></main>`,
'cover-c':`<main class="slide cover-c pad"><div class="stripe"></div><span class="eyebrow">展后线索处理清单</span><h1><span class="n num">300</span>条名片<br>别再一封邮件<br>群发到底</h1><p class="subtitle">先分层，再跟进；先识别采购信号，再交给销售</p><div class="quote">“线索不是躺在Excel里保存，而是排进下一步行动。”</div><div class="steps"><div><b>A/B/C/D</b>客户分层</div><div><b>4类信号</b>MOQ · 样品 · 认证 · 交期</div></div><div class="brand dark">黔海 QIANHAI</div></main>`,
'cover-d':`<main class="slide cover-photo"><img src="exhibition-exit-bg.png"><div class="photo-copy"><span class="pill">海外展会结束后</span><h1>收了<b class="num">300</b>张名片<br>真正进入跟进的<br>有几条？</h1><p>名片数量不是结果<br>持续跟进，才可能变成客户</p></div><div class="brand">黔海 QIANHAI</div></main>`,
'cover-e':`<main class="slide cover-question pad"><span class="eyebrow">展后最重要的问题</span><div class="question-mark">?</div><div class="hero-num num">300</div><h1>条线索<br><span class="blue">谁最值得先跟？</span></h1><p class="subtitle">不是平均用力，而是先识别采购商、经销商和高意向信号</p><div class="pipeline"><div class="pile">${'<i></i>'.repeat(16)}</div><div class="mid">→</div><div class="queue"><div><b>A 高意向</b><span>样品 · 报价 · 认证</span></div><div><b>B 需要培育</b><span>场景匹配，计划待确认</span></div><div><b>C 长期机会</b><span>低频持续触达</span></div></div></div><div class="brand dark">黔海 QIANHAI</div></main>`,
'cover-f':`<main class="slide cover-not-equal pad"><span class="eyebrow">外贸人容易混淆的一件事</span><h1 class="title"><span class="blue">300张名片</span><br>不等于300个客户</h1><p class="subtitle">采购角色、需求强度和下一步动作都不同</p><div class="equation"><div class="stack">${'<i></i>'.repeat(16)}</div><div class="sign">≠</div><div class="customer"><b>?</b><span>值得跟进的客户</span></div></div><div class="quote" style="margin-top:70px;padding:30px;border-radius:24px;background:#17253d;color:#fff;font-size:34px;font-weight:800">展后第一步：先识别，再行动。</div><div class="brand dark">黔海 QIANHAI</div></main>`,
'cover-g':`<main class="slide cover-segment pad"><span class="eyebrow">一张可直接照做的展后清单</span><h1>别急着群发邮件<br>先把线索分成<span class="red">4类</span></h1><p class="subtitle">不同意向，不同节奏；让销售先看见“谁值得先跟”</p><div class="segment-bars"><div class="sa"><b>A 高意向客户</b><span>48小时内</span></div><div class="sb"><b>B 需要培育</b><span>每周触达</span></div><div class="sc"><b>C 长期机会</b><span>双周触达</span></div><div class="sd"><b>D 低优先级</b><span>低频保留</span></div></div><div class="quote" style="margin-top:48px;padding:28px;border-radius:22px;background:#17253d;color:#fff;font-size:31px;font-weight:800">MOQ · 样品 · 认证 · 交期，是更值得关注的采购信号。</div><div class="brand dark">黔海 QIANHAI</div></main>`,
'cover-h':`<main class="slide cover-action pad"><span class="eyebrow" style="color:#8ec0ff">展会结束，不是项目结束</span><h1>展会结束<br><span>获客才刚刚开始</span></h1><p class="subtitle" style="color:#cad6e7">你缺的可能不是名单，而是持续发生的下一步</p><div class="action-row"><div><b>补全</b><span>企业与角色</span></div><div><b>识别</b><span>采购信号</span></div><div><b>跟进</b><span>下一步动作</span></div></div><div class="action-ui"><img src="${base}02_customer_operations.png"></div><div class="brand">黔海 QIANHAI</div></main>`,
'02':`<main class="slide pad"><span class="eyebrow">为什么线索会沉下去？</span><h1 class="title">展会之后，最常见的<br><span class="red">3个断点</span></h1><div class="problem-grid"><article class="problem"><span class="idx">01</span><h3>所有名片<br>同样处理</h3><p>采购商、经销商、同行和普通访客没有分层。</p></article><article class="problem"><span class="idx">02</span><h3>第一封邮件<br>就是最后一步</h3><p>没有围绕现场问过的问题继续触达。</p></article><article class="problem"><span class="idx">03</span><h3>互动没有<br>进入销售动作</h3><p>MOQ、认证、样品和交期信号很快丢失。</p></article></div><div class="quote" style="margin-top:70px;padding:34px;border-radius:24px;background:#17253d;color:#fff;font-size:36px;font-weight:800">真正消失的可能不是客户，<br>而是展会之后的持续经营。</div><div class="footer"><span>02 / 08</span><b>黔海｜AI数字员工驱动的产业出海增长平台</b></div></main>`,
'03':`<main class="slide pad"><span class="eyebrow">可直接保存的展后方法</span><h1 class="title">第一步不是群发<br>而是先做<span class="blue">客户分层</span></h1><div class="method-list"><article class="method a"><b>A</b><div><h3>高意向客户</h3><p>问过样品、报价、认证、交期或代理条件</p></div><em>48小时内跟进</em></article><article class="method b"><b>B</b><div><h3>需要培育</h3><p>场景匹配，但采购计划和决策角色不明确</p></div><em>每周触达</em></article><article class="method c"><b>C</b><div><h3>长期机会</h3><p>需求存在，采购周期较长或时点未成熟</p></div><em>双周触达</em></article><article class="method d"><b>D</b><div><h3>低优先级</h3><p>同行、服务商或暂时没有明确采购需求</p></div><em>低频保留</em></article></div><div class="footer"><span>03 / 08</span><b>先让销售看见“谁值得先跟”</b></div></main>`,
'04':`<main class="slide pad"><span class="eyebrow">真实产品界面</span><h1 class="title">AI先把线索整理好<br><span class="blue">人只处理关键动作</span></h1><div class="ui-card"><img src="${base}02_customer_operations.png"></div><div class="caption"><b>128</b><p>项日常客户动作已自动完成；正式报价、独家代理和超期商机被升级给负责人。</p></div><div class="footer"><span>04 / 08</span><b>黔海产品原型｜客户经营</b></div></main>`,
'05':`<main class="slide pad"><span class="eyebrow">真实产品界面</span><h1 class="title">线索不只是一行名字<br>还要知道<span class="blue">为什么值得跟</span></h1><div class="ui-card"><img src="${base}03_customer_workbench_tasks.png"></div><div class="signal-row"><div class="signal"><b>91</b><span>客户意向分</span></div><div class="signal"><b>500kg</b><span>明确采购量</span></div><div class="signal"><b>30天</b><span>预计决策周期</span></div></div><div class="footer"><span>05 / 08</span><b>数据为产品原型演示场景</b></div></main>`,
'06':`<main class="slide pad"><span class="eyebrow">真实产品界面</span><h1 class="title">客户问了一句话<br>AI要识别出<span class="blue">采购信号</span></h1><div class="ui-card"><img src="${base}04_customer_profile_chat.png"></div><div class="caption"><b>4类</b><p>采购量、食品级认证、正式报价、交付信息——这些才是需要进入下一步行动的信号。</p></div><div class="footer"><span>06 / 08</span><b>黔海产品原型｜客户洞察</b></div></main>`,
